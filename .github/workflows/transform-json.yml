name: Transform JSON to Markdown

on:
  push:
    paths:
      - 'translations/**.json'
      - 'render/transform.py'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Transform JSON to Markdown
        run: python render/transform.py

      - name: Commit and push changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          # -A also stages deleted files (Markdown whose JSON file was removed or renamed)
          git add -A md_files
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Markdown files"
            git push
          fi
